<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>OrthoStudent</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#03231f" stroke-width="2" stroke-linecap="round">
          <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z"/>
          <circle cx="12" cy="12" r="3.2" fill="#03231f" stroke="none"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">OrthoStudent</div>
        <div class="brand-sub">Suite orthoptie &middot; L1 &rarr; L3</div>
      </div>
    </div>

    <div class="side-search">
      <input id="navFilter" type="text" placeholder="Filtrer les outils…  (Ctrl+K)" aria-label="Filtrer les outils" />
    </div>

    <nav id="nav" aria-label="Modules"></nav>

    <div class="side-foot">
      <button id="backBtn" class="hist" title="Précédent (Alt+←)" aria-label="Précédent" disabled>←</button>
      <button id="fwdBtn" class="hist" title="Suivant (Alt+→)" aria-label="Suivant" disabled>→</button>
      <span id="footStat">—</span>
      <span class="spacer"></span>
      <button id="themeBtn" title="Basculer le thème (Ctrl+D)" aria-label="Basculer le thème">◐</button>
    </div>
  </aside>

  <main id="main"><div id="view"></div></main>
</div>

<div id="overlay" role="dialog" aria-modal="true" aria-label="Recherche rapide">
  <div class="search-panel">
    <input id="searchInput" type="text" placeholder="Rechercher un outil, une notion, un terme…" autocomplete="off"
           role="combobox" aria-expanded="true" aria-controls="searchRes" aria-autocomplete="list" aria-label="Rechercher" />
    <div class="search-res" id="searchRes" role="listbox" aria-label="Résultats"></div>
  </div>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-panel" tabindex="-1">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="modalTitle">Simulateur</div>
        <div class="modal-sub" id="modalSub"></div>
      </div>
      <button class="modal-close" id="modalClose" title="Fermer (Échap)">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div id="toast"></div>

<!-- Filtres SVG globaux (simulation optique) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="fx-astig" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur id="fx-astig-blur" stdDeviation="0 0" />
    </filter>
    <filter id="fx-astig2" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur id="fx-astig2-blur" stdDeviation="0 0" />
    </filter>
  </defs>
</svg>

<!-- Noyau -->
<script src="js/core/store.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/optics.js"></script>

<!-- Données -->
<script src="js/data/theory.js"></script>
<script src="js/data/glossary.js"></script>
<script src="js/data/quizbank.js"></script>
<script src="js/data/quizbank2.js"></script>
<script src="js/data/flashbank.js"></script>
<script src="js/data/cases.js"></script>
<script src="js/data/formulas.js"></script>
<script src="js/data/curriculum.js"></script>
<script src="js/data/ueguide.js"></script>
<script src="js/data/ueguide2.js"></script>
<script src="js/data/casegen.js"></script>
<script src="js/core/cards.js"></script>

<!-- Modules -->
<script src="js/modules/home.js"></script>
<script src="js/modules/theory.js"></script>
<script src="js/modules/studies.js"></script>
<script src="js/modules/anatomy.js"></script>
<script src="js/modules/converters.js"></script>
<script src="js/modules/phoropter.js"></script>
<script src="js/modules/skiascopy.js"></script>
<script src="js/modules/acuity.js"></script>
<script src="js/modules/covertest.js"></script>
<script src="js/modules/prism.js"></script>
<script src="js/modules/motility.js"></script>
<script src="js/modules/lancaster.js"></script>
<script src="js/modules/binocular.js"></script>
<script src="js/modules/ppc.js"></script>
<script src="js/modules/fundus.js"></script>
<script src="js/modules/colorvision.js"></script>
<script src="js/modules/fields.js"></script>
<script src="js/modules/patient.js"></script>
<script src="js/modules/rehab.js"></script>
<script src="js/modules/quiz.js"></script>
<script src="js/modules/exam.js"></script>
<script src="js/modules/flashcards.js"></script>
<script src="js/modules/glossary.js"></script>
<script src="js/modules/progress.js"></script>
<script src="js/modules/help.js"></script>

<!-- Boot -->
<script src="js/app.js"></script>
</body>
</html>
